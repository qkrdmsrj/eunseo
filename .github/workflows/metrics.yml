# .github/workflows/metrics.yml
name: Track Lead Time

on: #when
  pull_request:
    types: [closed]

jobs:
  track-lead-time:
    # PR이 병합되었을 떄만 실행
    # Run only when the pull request was merged
    if: github.event.pull_request.merged == true              
    runs-on: ubuntu-latest

    steps:
      - name: Calculate Lead Time on Ubuntu
        run: |
          FIRST_COMMIT_TIME="${{ github.event.pull_request.created_at }}"
          MERGE_TIME="${{ github.event.pull_request.merged_at }}"

          # Calculate the time difference in seconds
          LEAD_TIME=$(($(date -d "$MERGE_TIME" +%s) - $(date -d "$FIRST_COMMIT_TIME" +%s)))

          echo "Lead Time: $LEAD_TIME seconds"

  track-lead-time-macos:
    if: github.event.pull_request.merged == true
    runs-on: macos-latest

    steps:
      - name: Calculate Lead Time on macOS
        run: |
          FIRST_COMMIT_TIME="${{ github.event.pull_request.created_at }}"
          MERGE_TIME="${{ github.event.pull_request.merged_at }}"

          # macOS uses BSD date instead of GNU date.
          FIRST_COMMIT_SECONDS=$(date -j -f "%Y-%m-%dT%H:%M:%SZ" "$FIRST_COMMIT_TIME" +%s)
          MERGE_SECONDS=$(date -j -f "%Y-%m-%dT%H:%M:%SZ" "$MERGE_TIME" +%s)
          LEAD_TIME=$((MERGE_SECONDS - FIRST_COMMIT_SECONDS))

          echo "Lead Time: $LEAD_TIME seconds"

  track-lead-time-centos:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    container: quay.io/centos/centos:stream9

    steps:
      - name: Calculate Lead Time on CentOS
        run: |
          FIRST_COMMIT_TIME="${{ github.event.pull_request.created_at }}"
          MERGE_TIME="${{ github.event.pull_request.merged_at }}"

          # CentOS provides GNU date through coreutils.
          dnf install -y coreutils
          LEAD_TIME=$(($(date -d "$MERGE_TIME" +%s) - $(date -d "$FIRST_COMMIT_TIME" +%s)))

          echo "Lead Time: $LEAD_TIME seconds"
