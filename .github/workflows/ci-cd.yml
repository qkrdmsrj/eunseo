name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # -------------------------------------------------------------
  # 1. BUILD JOB: 빌드 시뮬레이션 및 아티팩트 저장
  # -------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create Build Artifact
        run: |
          mkdir dist
          echo "Build artifact generated" > dist/app-build.txt

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: dist/app-build.txt

  # -------------------------------------------------------------
  # 2. TEST JOB: Matrix 전략 적용 (OS 및 Python 버전 검증)
  # -------------------------------------------------------------
  test:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Linting (Flake8)
        run: |
          # 코드 구문 오류 검사
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: dist

      - name: Verify Environment & Artifact
        run: |
          python -c "import os; print('Testing matrix on OS: ${{ matrix.os }}, Python: ${{ matrix.python-version }}')"

  # -------------------------------------------------------------
  # 3. DEPLOY JOB: Build와 Test 성공 시 배포 실행
  # -------------------------------------------------------------
  deploy:
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: dist

      - name: Execute Deployment
        env:
          SECRET_TOKEN: ${{ secrets.MY_SECRET_TOKEN }}
        run: |
          echo "Starting Deployment..."
          cat dist/app-build.txt
          echo "Deployment completed successfully!"