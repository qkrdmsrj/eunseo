name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # -------------------------------------------------------------
  # 1. BUILD JOB: 코드 체크아웃, 빌드 및 아티팩트 업로드
  # -------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Simulate Build & Create Artifact
        run: |
          mkdir -p dist
          echo "Build artifact generated on $(date)" > dist/app-build.txt
          echo "Simulated Build Completed."

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: dist/app-build.txt

  # -------------------------------------------------------------
  # 2. TEST JOB (Matrix Strategy): OS 및 Python 버전 조합 테스트
  # -------------------------------------------------------------
  test:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Lint & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest

      - name: Run Lint Check (Flake8)
        run: |
          # 기본 구문 오류 및 린트 체크
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: dist

      - name: Verify Artifact & Run Test
        run: |
          python -c "print('Testing environment on ${{ matrix.os }} with Python ${{ matrix.python-version }}')"

  # -------------------------------------------------------------
  # 3. DEPLOY JOB: Build와 Test 완료 후 Secrets 주입받아 배포 실행
  # -------------------------------------------------------------
  deploy:
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: dist

      - name: Simulate Deployment with Secrets
        env:
          DEPLOY_ENV: production
          SECRET_TOKEN: ${{ secrets.MY_SECRET_TOKEN }}
        run: |
          echo "Starting deployment to $DEPLOY_ENV environment..."
          echo "Build file contents:"
          cat dist/app-build.txt
          echo "Deployment successful with Secret Token verification!"