name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src_any_changed }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for source code changes
        id: filter
        uses: tj-actions/changed-files@v44
        with:
          files: |
            src/**
            *.py
            requirements.txt

  build:
    needs: changes
    if: ${{ needs.changes.outputs.src == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python & Dependencies
        uses: ./.github/actions/setup-python-deps

      - name: Create Build Artifact
        run: |
          mkdir -p dist
          echo "Build artifact generated" > dist/app-build.txt

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: dist/app-build.txt

  test:
    needs: [changes, build]
    if: ${{ needs.changes.outputs.src == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/reusable-test.yml

  deploy:
    needs: [changes, build, test]
    if: ${{ (needs.changes.outputs.src == 'true' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: dist

      - name: Execute Selective Deployment
        env:
          SECRET_TOKEN: ${{ secrets.MY_SECRET_TOKEN || 'default_token' }}
        run: |
          echo "Executing production deployment..."
          cat dist/app-build.txt
          echo "Selective Deployment completed successfully!"
