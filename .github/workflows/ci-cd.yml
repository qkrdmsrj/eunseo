name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create Build Artifact
        run: |
          mkdir dist
          echo "Build artifact generated" > dist/app-build.txt

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: dist/app-build.txt

  test:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: dist

      - name: Verify Environment & Artifact
        run: |
          python -c "import os; print('Testing matrix on OS: ${{ matrix.os }}, Python: ${{ matrix.python-version }}')"

  deploy:
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: dist

      - name: Execute Deployment
        env:
          SECRET_TOKEN: ${{ secrets.MY_SECRET_TOKEN || 'default_token' }}
        run: |
          echo "Starting Deployment..."
          cat dist/app-build.txt
          echo "Deployment completed successfully!"